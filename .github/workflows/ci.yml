name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - run: python scripts/smoke_test.py

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - run: python -m isort --check-only --diff src
      - run: python -m black --check --diff src

  build:
    needs: [smoke-test, format-check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[build]"
      # No --windowed on purpose: keeps tracebacks visible in CI.
      - run: pyinstaller --noconfirm --name Shooter --paths src --add-data "src/game/assets;game/assets" run.py
      - uses: actions/upload-artifact@v4
        with:
          name: Shooter-windows
          path: dist/Shooter
