[project]
name = "shooter"
version = "0.1.0"
description = "2D top-down shooter"
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
shooter = "game.game:main"

[project.optional-dependencies]
build = ["pyinstaller"]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
deprecateTypingAliases = "standard"
typeCheckingMode = "standard"