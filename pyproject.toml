[project]
name = "shooter"
version = "0.1.0"
description = "2D top-down shooter"
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
shooter = "game.game:main"

[project.optional-dependencies]
build = ["pyinstaller"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game"]